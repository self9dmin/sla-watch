name: Bug report
description: Report a reproducible problem in SLA Watch
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tenant credentials, tokens, customer data, or screenshots containing sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include safe steps, app version, and whether the issue occurs in light or dark theme.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Dynatrace platform version or safe environment description. Do not include tenant IDs or credentials.
    validations:
      required: true
