name: Authenticated E2E

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Dynatrace environment URL hosting the deployed app under test
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DT_APP_E2E_URL: ${{ inputs.target_url }}
      DT_APP_E2E_AUTH_STATE: ${{ github.workspace }}/playwright/.auth/state.json
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore authenticated browser state
        env:
          PLAYWRIGHT_AUTH_STATE_B64: ${{ secrets.DT_APP_E2E_AUTH_STATE_B64 }}
        run: |
          test -n "$PLAYWRIGHT_AUTH_STATE_B64"
          mkdir -p "$(dirname "$DT_APP_E2E_AUTH_STATE")"
          printf '%s' "$PLAYWRIGHT_AUTH_STATE_B64" | base64 --decode > "$DT_APP_E2E_AUTH_STATE"

      - name: Run authenticated smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
